<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gérer la carte ❤️</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#321428,#b94b73,#ffd1dc);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#ffffff25;border:1px solid #ffffff40;border-radius:26px;padding:22px;backdrop-filter:blur(16px);margin:18px 0}h1{text-align:center}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;color:#4d1831}textarea{min-height:80px}button,a.btn{border:0;background:#fff;color:#b73768;padding:12px 17px;border-radius:999px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin-top:15px}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff2f;padding:12px 0}.grow{flex:1}.del{margin:0;background:#ffffff22;color:#fff}.muted{opacity:.8;font-size:.9rem}</style></head><body><main class="wrap"><h1>Gérer notre carte ❤️</h1><a class="btn" href="./">← Voir la carte</a><div class="card"><h2>Ajouter un souvenir</h2><label>Ville / lieu</label><input id="city" placeholder="Nice"><label>Date</label><input id="date" type="date"><label>Petit texte</label><textarea id="text" placeholder="Notre journée à Nice ☀️"></textarea><label>Photo (facultatif)</label><input id="photo" type="file" accept="image/*"><button onclick="add()">+ Ajouter</button><p id="status"></p><p class="muted">La ville est localisée automatiquement. Les données restent pour l'instant enregistrées dans ce navigateur.</p></div><div class="card"><h2>Souvenirs enregistrés</h2><div id="list"></div></div></main><script>const K='nos1an_places';let ps=JSON.parse(localStorage.getItem(K)||'[]');render();async function add(){let city=document.querySelector('#city').value.trim(),date=document.querySelector('#date').value,text=document.querySelector('#text').value.trim(),file=document.querySelector('#photo').files[0],s=document.querySelector('#status');if(!city){s.textContent='Indique une ville 🙂';return}s.textContent='Recherche de la ville…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q='+encodeURIComponent(city)),d=await r.json();if(!d.length){s.textContent='Ville introuvable.';return}let photo=file?await img(file):'';ps.push({id:Date.now(),city,date,text,photo,lat:+d[0].lat,lon:+d[0].lon});save();document.querySelector('#city').value='';document.querySelector('#date').value='';document.querySelector('#text').value='';document.querySelector('#photo').value='';s.textContent='Souvenir ajouté ❤️';render()}catch(e){s.textContent='Erreur pendant la recherche.'}}function img(f){return new Promise((ok,no)=>{let rd=new FileReader;rd.onload=()=>{let im=new Image;im.onload=()=>{let m=900,z=Math.min(1,m/im.width,m/im.height),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};im.src=rd.result};rd.onerror=no;rd.readAsDataURL(f)})}function save(){localStorage.setItem(K,JSON.stringify(ps))}function del(id){if(confirm('Supprimer ce souvenir ?')){ps=ps.filter(x=>x.id!==id);save();render()}}function render(){let l=document.querySelector('#list');l.innerHTML=ps.length?ps.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(p=>`<div class="item"><div class="grow"><b>📍 ${esc(p.city)}</b><br><span class="muted">${p.date||'Sans date'}</span></div><button class="del" onclick="del(${p.id})">Supprimer</button></div>`).join(''):'<p class="muted">Aucun souvenir pour le moment.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
