<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gérer la carte ❤️</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#321428,#b94b73,#ffd1dc);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#ffffff25;border:1px solid #ffffff40;border-radius:26px;padding:22px;backdrop-filter:blur(16px);margin:18px 0}h1{text-align:center}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;color:#4d1831}textarea{min-height:80px}button,a.btn{border:0;background:#fff;color:#b73768;padding:12px 17px;border-radius:999px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin-top:15px}.secondary{background:#ffffff22!important;color:#fff!important}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff2f;padding:12px 0}.grow{flex:1}.del{margin:0;background:#ffffff22;color:#fff}.muted{opacity:.8;font-size:.9rem}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Gérer notre carte ❤️</h1><a class="btn" href="./">← Voir la carte</a><div class="card" id="authCard"><h2>Connexion admin</h2><p class="muted">Connecte-toi pour ajouter ou supprimer des souvenirs. Si c’est ta première fois, crée ton compte ici.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button onclick="login()">Se connecter</button><button class="secondary" onclick="signup()">Créer mon compte</button></div><p id="authStatus"></p></div><div id="adminArea" class="hidden"><div class="card"><div class="row"><div><h2 style="margin-bottom:0">Ajouter un souvenir</h2><p class="muted" id="who"></p></div><div style="text-align:right"><button class="secondary" onclick="logout()">Déconnexion</button></div></div><label>Ville / lieu</label><input id="city" placeholder="Nice"><label>Date</label><input id="date" type="date"><label>Petit texte</label><textarea id="text" placeholder="Notre journée à Nice ☀️"></textarea><label>Photo (facultatif)</label><input id="photo" type="file" accept="image/*"><button onclick="add()">+ Ajouter</button><p id="status"></p><p class="muted">La ville est localisée automatiquement. La photo est compressée avant envoi.</p></div><div class="card"><h2>Souvenirs enregistrés</h2><div id="list"></div></div></div></main><script>const SUPABASE_URL='https://altfjneygqyltcasankm.supabase.co';const SUPABASE_KEY='sb_publishable_-lcIoJoTRumRVBVT7eQvBQ_O52mFMSM';const COLLECTION='julien-marie-annee-01';let token=localStorage.getItem('jm_admin_token')||'';let user=null;boot();async function boot(){if(token){const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(r.ok){user=await r.json();showAdmin();return}localStorage.removeItem('jm_admin_token');token=''}showAuth()}function showAuth(){document.querySelector('#authCard').classList.remove('hidden');document.querySelector('#adminArea').classList.add('hidden')}function showAdmin(){document.querySelector('#authCard').classList.add('hidden');document.querySelector('#adminArea').classList.remove('hidden');document.querySelector('#who').textContent=user?.email||'';load()}async function login(){const email=v('#email'),password=v('#password'),s=q('#authStatus');s.textContent='Connexion…';const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){s.textContent=d.error_description||d.msg||d.message||'Connexion impossible';return}token=d.access_token;user=d.user;localStorage.setItem('jm_admin_token',token);s.textContent='';showAdmin()}async function signup(){const email=v('#email'),password=v('#password'),s=q('#authStatus');if(!email||password.length<6){s.textContent='Mets un email et un mot de passe d’au moins 6 caractères.';return}s.textContent='Création du compte…';const r=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){s.textContent=d.msg||d.message||'Création impossible';return}if(d.access_token){token=d.access_token;user=d.user;localStorage.setItem('jm_admin_token',token);showAdmin()}else{s.textContent='Compte créé. Regarde tes mails pour confirmer ton adresse, puis connecte-toi ici.'}}function logout(){localStorage.removeItem('jm_admin_token');token='';user=null;showAuth()}async function add(){let city=v('#city'),date=v('#date'),text=v('#text'),file=q('#photo').files[0],s=q('#status');if(!city){s.textContent='Indique une ville 🙂';return}s.textContent='Recherche de la ville…';try{const geo=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q='+encodeURIComponent(city));const gd=await geo.json();if(!gd.length){s.textContent='Ville introuvable.';return}s.textContent='Enregistrement…';let photo=file?await img(file):null;const payload={collection_id:COLLECTION,city,memory_date:date||null,note:text||null,photo_url:photo,latitude:+gd[0].lat,longitude:+gd[0].lon};const r=await fetch(SUPABASE_URL+'/rest/v1/couple_memories',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)});if(r.status===401){logout();return}if(!r.ok)throw new Error(await r.text());q('#city').value='';q('#date').value='';q('#text').value='';q('#photo').value='';s.textContent='Souvenir ajouté ❤️';await load()}catch(e){console.error(e);s.textContent='Impossible d’enregistrer ce souvenir.'}}function img(f){return new Promise((ok,no)=>{let rd=new FileReader;rd.onload=()=>{let im=new Image;im.onload=()=>{let m=720,z=Math.min(1,m/im.width,m/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.62))};im.onerror=no;im.src=rd.result};rd.onerror=no;rd.readAsDataURL(f)})}async function load(){const l=q('#list');l.innerHTML='<p class="muted">Chargement…</p>';const url=`${SUPABASE_URL}/rest/v1/couple_memories?collection_id=eq.${encodeURIComponent(COLLECTION)}&select=id,city,memory_date,note&order=memory_date.asc.nullslast,created_at.asc`;const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(!r.ok){l.innerHTML='<p class="muted">Impossible de charger les souvenirs.</p>';return}const ps=await r.json();l.innerHTML=ps.length?ps.map(p=>`<div class="item"><div class="grow"><b>📍 ${esc(p.city)}</b><br><span class="muted">${p.memory_date?new Date(p.memory_date+'T12:00:00').toLocaleDateString('fr-FR'):'Sans date'}${p.note?' · '+esc(p.note):''}</span></div><button class="del" onclick="del(${p.id})">Supprimer</button></div>`).join(''):'<p class="muted">Aucun souvenir pour le moment.</p>'}async function del(id){if(!confirm('Supprimer ce souvenir ?'))return;const r=await fetch(`${SUPABASE_URL}/rest/v1/couple_memories?id=eq.${id}`,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,Prefer:'return=minimal'}});if(r.ok)load();else alert('Suppression impossible.')}function q(s){return document.querySelector(s)}function v(s){return q(s).value.trim()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
