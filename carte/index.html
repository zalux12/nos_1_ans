ight:1;box-shadow:0 8px 22px #30101b28}.together-copy{min-width:0}.together-kicker{display:block;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#ffe0e9}.together-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:9px;margin:4px 0}.together-line strong{font-size:clamp(2.3rem,5vw,3.5rem);line-height:1;font-variant-numeric:tabular-nums}.together-line span{font-size:1.15rem;font-weight:750}.together-copy p{margin:4px 0 0;font-size:.87rem;color:#ffe1eb}.year-summary{margin:12px auto 18px;padding:18px 20px;max-width:760px;border:1px solid #ffffff55;border-radius:20px;background:#ffffff20;box-shadow:0 8px 30px #32142818;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.year-summary[hidden]{display:none}.year-summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.year-summary-title{font-size:1.1rem;font-weight:850}.year-summary-sub{font-size:.8rem;color:#ffe4ed}.year-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.year-summary-metric{padding:12px 8px;text-align:center;background:#ffffff1b;border:1px solid #ffffff30;border-radius:14px}.year-summary-metric strong{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.year-summary-metric span{display:block;margin-top:3px;font-size:.75rem;color:#ffe1e9}.map-shell{position:relative}#map{height:65vh;min-height:450px;border-radius:26px;box-shadow:0 20px 60px #0004;border:1px solid #ffffff55}.map-tools{position:absolute;z-index:800;top:12px;right:12px;display:flex;flex-direction:column;gap:8px}.map-tool{min-width:46px;min-height:46px;border:1px solid #bbb;background:#fff;color:#333;border-radius:10px;box-shadow:0 1px 5px #0004;font:700 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 11px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.btn,.map-tool,.legend-item{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.btn:hover,.map-tool:hover,.legend-item:hover{transform:translateY(-2px);box-shadow:0 7px 20px #32142835}.btn:focus-visible,.map-tool:focus-visible,.legend-item:focus-visible{outline:3px solid #fff;outline-offset:3px}.map-tool.active{background:#b73768;color:#fff;border-color:#b73768}.map-tool.close-mode{width:46px;min-width:46px;padding:0;border-radius:50%;border-color:#ffffffcc;color:#b73768;font-size:30px;font-weight:400;line-height:1;box-shadow:0 4px 16px #0004}.leaflet-popup-content-wrapper{border-radius:18px}.leaflet-popup-content{font-family:inherit;min-width:210px}.leaflet-container a.leaflet-popup-close-button{top:8px;right:8px;width:30px;height:30px;padding:0;border-radius:50%;background:#fff;color:#b73768!important;border:1px solid #b7376833;box-shadow:0 2px 8px #0002;font-size:25px;font-weight:400;line-height:27px;text-align:center;transition:transform .15s,background .15s,color .15s}.leaflet-container a.leaflet-popup-close-button:hover{background:#b73768;color:#fff!important;transform:scale(1.06)}.popup h3{margin:8px 0 3px}.popup p{margin:4px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;color:#fff;font-size:.78rem;font-weight:800;margin-top:7px}.actionsbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{display:inline-block;background:#fff;color:#b73768;text-decoration:none;font-weight:900;padding:11px 16px;border-radius:999px}.btn.secondary{background:#ffffff20;color:#fff;border:1px solid #ffffff35}.state{text-align:center;margin:14px 0;opacity:.85}.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px}.legend-item{display:flex;align-items:center;gap:6px;background:#ffffff20;color:#fff;border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font:inherit;font-size:.88rem;cursor:pointer;min-height:42px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,opacity .15s}.legend-item.selected{background:#fff;color:#7b294c;border-color:#fff;font-weight:800;box-shadow:0 5px 16px #32142825}.legend-item.dimmed{opacity:.58}.legend-heart{font-size:1.2rem;line-height:1}.heart-marker{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 3px #0006);text-shadow:0 0 1px #fff}.leaflet-div-icon{background:transparent;border:0}.gallery{position:relative;margin-bottom:8px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;display:block}.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}.gprev{left:7px}.gnext{right:7px}.gcount{position:absolute;right:8px;bottom:8px;background:#0009;color:#fff;padding:3px 7px;border-radius:999px;font-size:.75rem;font-weight:700}.map-shell.pseudo-fullscreen,.map-shell:fullscreen,.map-shell:-webkit-full-screen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:9999;background:#111;padding:0}.map-shell.pseudo-fullscreen #map,.map-shell:fullscreen #map,.map-shell:-webkit-full-screen #map{width:100%;height:100%!important;min-height:0!important;border:0;border-radius:0;box-shadow:none}.map-shell.pseudo-fullscreen .map-tools,.map-shell:fullscreen .map-tools,.map-shell:-webkit-full-screen .map-tools{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}body.map-fullscreen{overflow:hidden}@media(prefers-reduced-motion:reduce){.btn,.map-tool,.legend-item{transition:none}}@media(max-width:600px){.together{padding:17px 14px;gap:13px;border-radius:20px;margin-top:20px}.together-icon{width:54px;height:54px;flex-basis:54px;font-size:40px;border-radius:17px}.together-kicker{font-size:.65rem;letter-spacing:.03em}.together-line{gap:6px}.together-line strong{font-size:2.25rem}.together-line span{font-size:.92rem}.together-copy p{font-size:.75rem}.year-summary{padding:14px 12px}.year-summary-metric{padding:10px 4px}.year-summary-metric strong{font-size:1.1rem}.year-summary-metric span{font-size:.68rem}.wrap{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:12px 4px}.stat b{font-size:1.15rem}.stat small{font-size:.72rem}.legend-item{min-height:44px;padding:9px 12px}#map{height:62vh;height:62dvh;min-height:400px;border-radius:20px}.map-tools{top:10px;right:10px}.map-tool{min-width:48px;min-height:48px;font-size:13px}.map-tool.close-mode{width:48px;min-width:48px;font-size:31px}.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;font-size:22px!important}.leaflet-popup-content{max-width:72vw}.gallery img{height:160px}}</style></head><body><main class="wrap"><h1>Notre histoire ♡</h1><p class="sub">Tous les endroits où notre histoire nous a emmenés, année après année.</p><section class="together" aria-label="Notre histoire depuis le 21 septembre 2025"><div class="together-icon" aria-hidden="true">♡</div><div class="together-copy"><span class="together-kicker">Julien &amp; Marie · Depuis le 21 septembre 2025</span><div class="together-line"><strong id="daysTogether">—</strong><span>jours ensemble <span aria-hidden="true">❤️</span></span></div><p>Et ce n’est que le début de notre aventure…</p></div></section><section class="stats" aria-label="Statistiques de nos souvenirs"><div class="stat"><b id="cities">0</b><small>villes</small></div><div class="stat"><b id="photos">0</b><small>photos</small></div><div class="stat"><b id="distance">0</b><small>km</small></div></section><div class="actionsbar"><a class="btn" href="ajouter.html">＋ Ajouter un souvenir</a><a class="btn secondary" href="admin.html">⚙️ Modifier / supprimer</a></div><div id="legend" class="legend" aria-label="Filtrer les souvenirs par année"></div><section id="yearSummary" class="year-summary" aria-live="polite" hidden></section><p class="state" id="state">Chargement de nos souvenirs…</p><div id="mapShell" class="map-shell"><div id="map"></div><div class="map-tools"><button id="layerBtn" class="map-tool" type="button" onclick="toggleLayer()">🛰️ Satellite</button><button id="fullBtn" class="map-tool" type="button" onclick="toggleFullscreen()">⛶ Plein écran</button></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL='https://altfjneygqyltcasankm.supabase.co',SUPABASE_KEY='sb_publishable_-lcIoJoTRumRVBVT7eQvBQ_O52mFMSM',COLLECTION='julien-marie-annee-01',COLORS=['#ef4f88','#4f8ee8','#9b6ce8','#f3a83b','#55b98c','#e66767','#36a6b8','#d96eb4','#7f9d55','#7b78d8'];const map=L.map('map',{tap:true}).setView([46.6,2.5],5.5),street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19});street.addTo(map);updateTogetherDays();setInterval(updateTogetherDays,3600000);let satelliteMode=false,allMemories=[],memoryMarkers=[],selectedYear=null;load();function setFullButton(on){const b=document.getElementById('fullBtn');b.classList.toggle('close-mode',on);b.textContent=on?'×':'⛶ Plein écran';b.setAttribute('aria-label',on?'Fermer le plein écran':'Ouvrir la carte en plein écran')}function updateTogetherDays(){const start=Date.UTC(2025,8,21),today=new Date(),day=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());document.getElementById('daysTogether').textContent=Math.max(0,Math.round((day-start)/86400000)).toLocaleString('fr-FR')}function updateYearSummary(year,visible){const panel=document.getElementById('yearSummary');if(year===null||!visible.length){panel.hidden=true;panel.innerHTML='';return}const cities=new Set(visible.map(p=>String(p.city||'').trim().toLocaleLowerCase('fr'))),photos=visible.reduce((n,p)=>n+p.photos.length,0),first=visible.filter(p=>p.date).map(p=>p.date).sort()[0],last=visible.filter(p=>p.endDate||p.date).map(p=>p.endDate||p.date).sort().at(-1);const dates=first?(first===last?formatRange(first,null):formatRange(first,last)):'Vos souvenirs de cette année';panel.innerHTML='<div class="year-summary-head"><span class="year-summary-title">✨ Votre année '+String(year).padStart(2,'0')+'</span><span class="year-summary-sub">'+esc(dates)+'</span></div><div class="year-summary-grid"><div class="year-summary-metric"><strong>'+cities.size+'</strong><span>villes visitées</span></div><div class="year-summary-metric"><strong>'+photos+'</strong><span>photos souvenirs</span></div><div class="year-summary-metric"><strong>'+Math.round(nearestLoop(visible.filter((p,i,a)=>a.findIndex(x=>String(x.city).toLowerCase()===String(p.city).toLowerCase())===i))).toLocaleString('fr-FR')+'</strong><span>km parcourus*</span></div></div><p class="year-summary-sub" style="margin:10px 0 0">*Distance estimée entre les villes enregistrées.</p>';panel.hidden=false}function toggleLayer(){satelliteMode=!satelliteMode;if(satelliteMode){map.removeLayer(street);satellite.addTo(map)}else{map.removeLayer(satellite);street.addTo(map)}const b=document.getElementById('layerBtn');b.classList.toggle('active',satelliteMode);b.textContent=satelliteMode?'🗺️ Plan':'🛰️ Satellite';setTimeout(()=>map.invalidateSize(),100)}async function toggleFullscreen(){const shell=document.getElementById('mapShell'),native=!!shell.requestFullscreen&&!(/iPhone|iPad|iPod/i.test(navigator.userAgent));if(native){try{if(!document.fullscreenElement)await shell.requestFullscreen();else await document.exitFullscreen();return}catch(e){}}const on=shell.classList.toggle('pseudo-fullscreen');document.body.classList.toggle('map-fullscreen',on);setFullButton(on);setTimeout(()=>map.invalidateSize(),150)}document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;document.body.classList.toggle('map-fullscreen',on);setFullButton(on);requestAnimationFrame(()=>{map.invalidateSize();setTimeout(()=>map.invalidateSize(),180)})});window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),250));window.addEventListener('resize',()=>map.invalidateSize());async function load(){const st=document.getElementById('state');try{const r=await fetch(`${SUPABASE_URL}/rest/v1/couple_memories?collection_id=eq.${encodeURIComponent(COLLECTION)}&select=id,city,memory_date,memory_end_date,note,photo_url,photo_urls,latitude,longitude,memory_year&order=memory_year.asc,memory_date.asc.nullslast,created_at.asc`,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();allMemories=rows.map(x=>({id:x.id,city:x.city,date:x.memory_date,endDate:x.memory_end_date,text:x.note,photos:x.photo_urls&&x.photo_urls.length?x.photo_urls:(x.photo_url?[x.photo_url]:[]),lat:x.latitude,lon:x.longitude,year:x.memory_year||1}));buildMarkers();buildYearFilters();applyYearFilter(null)}catch(e){console.error(e);st.textContent='Impossible de charger les souvenirs pour le moment.'}}function buildMarkers(){memoryMarkers=allMemories.map(p=>{const col=color(p.year),icon=L.divIcon({html:`<div class="heart-marker" style="color:${col}">♥</div>`,className:'',iconSize:[32,32],iconAnchor:[16,26]}),dates=formatRange(p.date,p.endDate),marker=L.marker([p.lat,p.lon],{icon});marker.bindPopup(`<div class="popup">${gallery(p)}<span class="badge" style="background:${col}">Année ${String(p.year).padStart(2,'0')}</span><h3>📍 ${esc(p.city)}</h3>${dates?`<p>📅 ${dates}</p>`:''}${p.text?`<p>${esc(p.text)}</p>`:''}</div>`);return{p,marker}})}function buildYearFilters(){const years=[...new Set(allMemories.map(p=>p.year))].sort((a,b)=>a-b);document.getElementById('legend').innerHTML=years.map(y=>`<button type="button" class="legend-item" data-year="${y}" onclick="filterYear(${y})"><span class="legend-heart" style="color:${color(y)}">♥</span> Année ${String(y).padStart(2,'0')}</button>`).join('')}function filterYear(year){applyYearFilter(selectedYear===year?null:year)}function applyYearFilter(year){selectedYear=year;map.closePopup();for(const x of memoryMarkers){const show=year===null||x.p.year===year;if(show&&!map.hasLayer(x.marker))x.marker.addTo(map);if(!show&&map.hasLayer(x.marker))map.removeLayer(x.marker)}document.querySelectorAll('.legend-item').forEach(b=>{const y=Number(b.dataset.year);b.classList.toggle('selected',year===y);b.classList.toggle('dimmed',year!==null&&year!==y);b.setAttribute('aria-pressed',year===y?'true':'false')});const visible=year===null?allMemories:allMemories.filter(p=>p.year===year);updateStats(visible);updateYearSummary(year,visible);fitVisible(visible);document.getElementById('state').textContent=visible.length?(year===null?'Touchez un cœur pour ouvrir un souvenir ❤️':`Année ${String(year).padStart(2,'0')} — ${visible.length} lieu${visible.length>1?'x':''} affiché${visible.length>1?'s':''} · retouchez l’année pour tout afficher`):'Aucun souvenir pour cette année.'}function updateStats(ps){const unique=[];for(const p of ps)if(!unique.some(x=>x.city.toLowerCase()===p.city.toLowerCase()))unique.push(p);document.getElementById('cities').textContent=unique.length;document.getElementById('photos').textContent=ps.reduce((n,p)=>n+p.photos.length,0);document.getElementById('distance').textContent=Math.round(nearestLoop(unique)).toLocaleString('fr-FR')}function fitVisible(ps){if(!ps.length)return;const bounds=L.latLngBounds(ps.map(p=>[p.lat,p.lon]));if(ps.length===1)map.setView([ps[0].lat,ps[0].lon],10);else map.fitBounds(bounds.pad(.25),{maxZoom:8})}function nearestLoop(points){if(points.length<2)return 0;let best=Infinity;for(let start=0;start<points.length;start++){const used=new Set([start]);let cur=start,total=0;while(used.size<points.length){let ni=-1,nd=Infinity;for(let i=0;i<points.length;i++)if(!used.has(i)){const d=hav(points[cur],points[i]);if(d<nd){nd=d;ni=i}}total+=nd;used.add(ni);cur=ni}total+=hav(points[cur],points[start]);if(total<best)best=total}return best}function gallery(p){if(!p.photos.length)return'';const arr=encodeURIComponent(JSON.stringify(p.photos));return `<div class="gallery" data-photos="${arr}" data-index="0"><img src="${p.photos[0]}" alt="Souvenir à ${esc(p.city)}">${p.photos.length>1?`<button class="gbtn gprev" onclick="slidePhoto(this,-1);event.stopPropagation()">‹</button><button class="gbtn gnext" onclick="slidePhoto(this,1);event.stopPropagation()">›</button><span class="gcount">1/${p.photos.length}</span>`:''}</div>`}function slidePhoto(btn,dir){const g=btn.closest('.gallery'),photos=JSON.parse(decodeURIComponent(g.dataset.photos));let i=(Number(g.dataset.index)+dir+photos.length)%photos.length;g.dataset.index=String(i);g.querySelector('img').src=photos[i];const c=g.querySelector('.gcount');if(c)c.textContent=`${i+1}/${photos.length}`}function formatRange(a,b){if(!a)return'';const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});return b&&b!==a?`${f(a)} → ${f(b)}`:f(a)}function color(y){return COLORS[((Number(y)||1)-1)%COLORS.length]}function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlon=r(b.lon-a.lon),q=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
