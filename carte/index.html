<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notre première année — Carte ❤️</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#321428,#b94b73,#ffd1dc);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{text-align:center;margin:8px 0}.sub{text-align:center;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#ffffff26;border:1px solid #ffffff38;border-radius:20px;padding:18px;text-align:center;backdrop-filter:blur(12px)}.stat b{display:block;font-size:1.7rem}#map{height:65vh;min-height:450px;border-radius:26px;box-shadow:0 20px 60px #0004;border:1px solid #ffffff55}.leaflet-popup-content-wrapper{border-radius:18px}.leaflet-popup-content{font-family:inherit;min-width:190px}.popup img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}.popup h3{margin:8px 0 3px}.popup p{margin:4px 0}.admin{display:block;text-align:center;margin:18px;color:#fff;opacity:.65;text-decoration:none}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:12px 5px}.stat b{font-size:1.25rem}#map{height:62vh;min-height:400px}}</style></head><body><main class="wrap"><h1>Notre première année ♡</h1><p class="sub">Tous les endroits où notre histoire nous a emmenés.</p><section class="stats"><div class="stat"><b id="cities">0</b>villes</div><div class="stat"><b id="regions">—</b>souvenirs</div><div class="stat"><b id="distance">0</b>km ≈</div></section><div id="map"></div><a class="admin" href="../admin/">Gérer les souvenirs</a></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const KEY='nos1an_places';const places=JSON.parse(localStorage.getItem(KEY)||'[]').sort((a,b)=>(a.date||'').localeCompare(b.date||''));const map=L.map('map').setView([46.6,2.5],5.5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);const icon=L.divIcon({html:'<div style="font-size:28px;filter:drop-shadow(0 2px 3px #0005)">❤️</div>',className:'',iconSize:[30,30],iconAnchor:[15,25]});places.forEach(p=>{const date=p.date?new Date(p.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<div class="popup">${p.photo?`<img src="${p.photo}" alt="">`:''}<h3>📍 ${esc(p.city)}</h3><p>${date}</p>${p.text?`<p>${esc(p.text)}</p>`:''}</div>`)});document.getElementById('cities').textContent=new Set(places.map(p=>p.city.toLowerCase())).size;document.getElementById('regions').textContent=places.length;let km=0;for(let i=1;i<places.length;i++)km+=hav(places[i-1],places[i]);document.getElementById('distance').textContent=Math.round(km).toLocaleString('fr-FR');if(places.length){const g=L.featureGroup(places.map(p=>L.marker([p.lat,p.lon])));map.fitBounds(g.getBounds().pad(.25),{maxZoom:8})}function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlon=r(b.lon-a.lon),q=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
