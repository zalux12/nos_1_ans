="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m3 17 5-5 3.3 3 3.2-4L21 18"/></svg></span><div class="stat-copy"><b id="photos">0</b><small>photos</small></div></div><div class="stat"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM18 14a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/><path d="M7.5 10c-.5 5 10 .5 9.3 5.5"/><path d="m4 12 2 2 2-2"/></svg></span><div class="stat-copy"><b id="distance">0</b><small>km</small></div></div></section></div></header><div class="actionsbar"><a class="btn" href="ajouter.html">＋ Ajouter un souvenir</a><a class="btn secondary" href="admin.html">⚙️ Modifier / supprimer</a></div><div id="legend" class="legend" aria-label="Filtrer les souvenirs par année"></div><section id="yearSummary" class="year-summary" aria-live="polite" hidden></section><p class="state" id="state">Chargement de nos souvenirs…</p><div id="mapShell" class="map-shell"><div id="map"></div><div class="map-tools"><button id="layerBtn" class="map-tool" type="button" onclick="toggleLayer()">🛰️ Satellite</button><button id="fullBtn" class="map-tool" type="button" onclick="toggleFullscreen()">⛶ Plein écran</button></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL='https://altfjneygqyltcasankm.supabase.co',SUPABASE_KEY='sb_publishable_-lcIoJoTRumRVBVT7eQvBQ_O52mFMSM',COLLECTION='julien-marie-annee-01',COLORS=['#ef4f88','#4f8ee8','#9b6ce8','#f3a83b','#55b98c','#e66767','#36a6b8','#d96eb4','#7f9d55','#7b78d8'];const map=L.map('map',{tap:true,zoomSnap:0.25,zoomDelta:0.5,wheelPxPerZoomLevel:240,wheelDebounceTime:100}).setView([46.6,2.5],5.5),street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:19});street.addTo(map);updateTogetherDays();setInterval(updateTogetherDays,3600000);let satelliteMode=false,allMemories=[],memoryMarkers=[],selectedYear=null;load();function setFullButton(on){const b=document.getElementById('fullBtn');b.classList.toggle('close-mode',on);b.textContent=on?'×':'⛶ Plein écran';b.setAttribute('aria-label',on?'Fermer le plein écran':'Ouvrir la carte en plein écran')}function updateTogetherDays(){const start=Date.UTC(2025,8,21),today=new Date(),day=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());document.getElementById('daysTogether').textContent=Math.max(0,Math.round((day-start)/86400000)).toLocaleString('fr-FR')}function updateYearSummary(year,visible){const panel=document.getElementById('yearSummary');if(year===null||!visible.length){panel.hidden=true;panel.innerHTML='';return}const cities=new Set(visible.map(p=>String(p.city||'').trim().toLocaleLowerCase('fr'))),photos=visible.reduce((n,p)=>n+p.photos.length,0),first=visible.filter(p=>p.date).map(p=>p.date).sort()[0],last=visible.filter(p=>p.endDate||p.date).map(p=>p.endDate||p.date).sort().at(-1);const startYear=2024+Number(year),dates='21 septembre '+startYear+' → 21 septembre '+(startYear+1);panel.innerHTML='<div class="year-summary-head"><span class="year-summary-sub">'+esc(dates)+'</span></div><div class="year-summary-grid"><div class="year-summary-metric"><strong>'+cities.size+'</strong><span>villes visitées</span></div><div class="year-summary-metric"><strong>'+photos+'</strong><span>photos souvenirs</span></div><div class="year-summary-metric"><strong>'+Math.round(nearestLoop(visible.filter((p,i,a)=>a.findIndex(x=>String(x.city).toLowerCase()===String(p.city).toLowerCase())===i))).toLocaleString('fr-FR')+'</strong><span>km parcourus*</span></div></div><p class="year-summary-sub" style="margin:10px 0 0">*Distance estimée entre les villes enregistrées.</p>';panel.hidden=false}function toggleLayer(){satelliteMode=!satelliteMode;if(satelliteMode){map.removeLayer(street);satellite.addTo(map)}else{map.removeLayer(satellite);street.addTo(map)}const b=document.getElementById('layerBtn');b.classList.toggle('active',satelliteMode);b.textContent=satelliteMode?'🗺️ Plan':'🛰️ Satellite';setTimeout(()=>map.invalidateSize(),100)}async function toggleFullscreen(){const shell=document.getElementById('mapShell'),native=!!shell.requestFullscreen&&!(/iPhone|iPad|iPod/i.test(navigator.userAgent));if(native){try{if(!document.fullscreenElement)await shell.requestFullscreen();else await document.exitFullscreen();return}catch(e){}}const on=shell.classList.toggle('pseudo-fullscreen');document.body.classList.toggle('map-fullscreen',on);setFullButton(on);setTimeout(()=>map.invalidateSize(),150)}document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;document.body.classList.toggle('map-fullscreen',on);setFullButton(on);requestAnimationFrame(()=>{map.invalidateSize();setTimeout(()=>map.invalidateSize(),180)})});window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),250));window.addEventListener('resize',()=>map.invalidateSize());async function load(){const st=document.getElementById('state');try{const r=await fetch(`${SUPABASE_URL}/rest/v1/couple_memories?collection_id=eq.${encodeURIComponent(COLLECTION)}&select=id,city,memory_date,memory_end_date,note,photo_url,photo_urls,latitude,longitude,memory_year&order=memory_year.asc,memory_date.asc.nullslast,created_at.asc`,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();allMemories=rows.map(x=>({id:x.id,city:x.city,date:x.memory_date,endDate:x.memory_end_date,text:x.note,photos:x.photo_urls&&x.photo_urls.length?x.photo_urls:(x.photo_url?[x.photo_url]:[]),lat:x.latitude,lon:x.longitude,year:x.memory_year||1}));buildMarkers();buildYearFilters();applyYearFilter(null);setupHeroPhotos()}catch(e){console.error(e);st.textContent='Impossible de charger les souvenirs pour le moment.'}}function setupHeroPhotos(){const photos=[],locations=new Set();for(const m of allMemories){if(m.photos.length&&!locations.has(m.city.toLowerCase())){const src=m.photos.find(p=>typeof p==='string'&&(p.startsWith('data:image/')||p.startsWith('https://')));if(src){photos.push(src);locations.add(m.city.toLowerCase())}}}if(!photos.length)return;for(let i=1;i<=4;i++){const img=document.getElementById('heroPhoto'+i);if(!img)continue;img.onload=()=>img.parentElement.classList.add('ready');img.onerror=()=>img.parentElement.classList.remove('ready');img.src=photos[Math.floor((i-1)*photos.length/4)]||photos[photos.length-1]}}
function buildMarkers(){memoryMarkers=allMemories.map(p=>{const col=color(p.year),icon=L.divIcon({html:`<div class="heart-marker" style="color:${col}">♥</div>`,className:'',iconSize:[32,32],iconAnchor:[16,26]}),dates=formatRange(p.date,p.endDate),marker=L.marker([p.lat,p.lon],{icon});marker.bindPopup(`<div class="popup">${gallery(p)}<span class="badge" style="background:${col}">Année ${String(p.year).padStart(2,'0')}</span><h3>📍 ${esc(p.city)}</h3>${dates?`<p>📅 ${dates}</p>`:''}${p.text?`<p>${esc(p.text)}</p>`:''}</div>`);return{p,marker}})}function buildYearFilters(){const years=[...new Set(allMemories.map(p=>p.year))].sort((a,b)=>a-b);document.getElementById('legend').innerHTML=years.map(y=>`<button type="button" class="legend-item" data-year="${y}" onclick="filterYear(${y})"><span class="legend-heart" style="color:${color(y)}">♥</span> Année ${String(y).padStart(2,'0')}</button>`).join('')}function filterYear(year){applyYearFilter(selectedYear===year?null:year)}function applyYearFilter(year){selectedYear=year;map.closePopup();for(const x of memoryMarkers){const show=year===null||x.p.year===year;if(show&&!map.hasLayer(x.marker))x.marker.addTo(map);if(!show&&map.hasLayer(x.marker))map.removeLayer(x.marker)}document.querySelectorAll('.legend-item').forEach(b=>{const y=Number(b.dataset.year);b.classList.toggle('selected',year===y);b.classList.toggle('dimmed',year!==null&&year!==y);b.setAttribute('aria-pressed',year===y?'true':'false')});const visible=year===null?allMemories:allMemories.filter(p=>p.year===year);updateStats(visible);updateYearSummary(year,visible);fitVisible(visible);document.getElementById('state').textContent=visible.length?(year===null?'Touchez un cœur pour ouvrir un souvenir ❤️':`Année ${String(year).padStart(2,'0')} — ${visible.length} lieu${visible.length>1?'x':''} affiché${visible.length>1?'s':''} · retouchez l’année pour tout afficher`):'Aucun souvenir pour cette année.'}function updateStats(ps){const unique=[];for(const p of ps)if(!unique.some(x=>x.city.toLowerCase()===p.city.toLowerCase()))unique.push(p);document.getElementById('cities').textContent=unique.length;document.getElementById('photos').textContent=ps.reduce((n,p)=>n+p.photos.length,0);document.getElementById('distance').textContent=Math.round(nearestLoop(unique)).toLocaleString('fr-FR')}function fitVisible(ps){if(!ps.length)return;const bounds=L.latLngBounds(ps.map(p=>[p.lat,p.lon]));if(ps.length===1)map.setView([ps[0].lat,ps[0].lon],10);else map.fitBounds(bounds.pad(.25),{maxZoom:8})}function nearestLoop(points){if(points.length<2)return 0;let best=Infinity;for(let start=0;start<points.length;start++){const used=new Set([start]);let cur=start,total=0;while(used.size<points.length){let ni=-1,nd=Infinity;for(let i=0;i<points.length;i++)if(!used.has(i)){const d=hav(points[cur],points[i]);if(d<nd){nd=d;ni=i}}total+=nd;used.add(ni);cur=ni}total+=hav(points[cur],points[start]);if(total<best)best=total}return best}function gallery(p){if(!p.photos.length)return'';const arr=encodeURIComponent(JSON.stringify(p.photos));return `<div class="gallery" data-photos="${arr}" data-index="0"><img src="${p.photos[0]}" alt="Souvenir à ${esc(p.city)}">${p.photos.length>1?`<button class="gbtn gprev" onclick="slidePhoto(this,-1);event.stopPropagation()">‹</button><button class="gbtn gnext" onclick="slidePhoto(this,1);event.stopPropagation()">›</button><span class="gcount">1/${p.photos.length}</span>`:''}</div>`}function slidePhoto(btn,dir){const g=btn.closest('.gallery'),photos=JSON.parse(decodeURIComponent(g.dataset.photos));let i=(Number(g.dataset.index)+dir+photos.length)%photos.length;g.dataset.index=String(i);g.querySelector('img').src=photos[i];const c=g.querySelector('.gcount');if(c)c.textContent=`${i+1}/${photos.length}`}function formatRange(a,b){if(!a)return'';const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});return b&&b!==a?`${f(a)} → ${f(b)}`:f(a)}function color(y){return COLORS[((Number(y)||1)-1)%COLORS.length]}function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlon=r(b.lon-a.lon),q=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
