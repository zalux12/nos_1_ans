<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notre histoire — Carte ❤️</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ef4f88' d='M50 88S10 64 10 34C10 16 32 9 50 28 68 9 90 16 90 34c0 30-40 54-40 54Z'/%3E%3C/svg%3E"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:linear-gradient(135deg,#321428,#b94b73,#ffd1dc);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{text-align:center;margin:8px 0}.sub{text-align:center;opacity:.9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#ffffff26;border:1px solid #ffffff38;border-radius:20px;padding:18px;text-align:center;backdrop-filter:blur(12px)}.stat b{display:block;font-size:1.7rem}#map{height:65vh;min-height:450px;border-radius:26px;box-shadow:0 20px 60px #0004;border:1px solid #ffffff55}.leaflet-popup-content-wrapper{border-radius:18px}.leaflet-popup-content{font-family:inherit;min-width:210px}.popup h3{margin:8px 0 3px}.popup p{margin:4px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;color:#fff;font-size:.78rem;font-weight:800;margin-top:7px}.actionsbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{display:inline-block;background:#fff;color:#b73768;text-decoration:none;font-weight:900;padding:11px 16px;border-radius:999px}.btn.secondary{background:#ffffff20;color:#fff;border:1px solid #ffffff35}.state{text-align:center;margin:14px 0;opacity:.85}.legend{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}.legend-item{display:flex;align-items:center;gap:6px;background:#ffffff20;border:1px solid #ffffff33;border-radius:999px;padding:7px 11px;font-size:.88rem}.legend-heart{font-size:1.2rem;line-height:1}.heart-marker{font-size:30px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 3px #0006);text-shadow:0 0 1px #fff}.leaflet-div-icon{background:transparent;border:0}.gallery{position:relative;margin-bottom:8px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;display:block}.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}.gprev{left:7px}.gnext{right:7px}.gcount{position:absolute;right:8px;bottom:8px;background:#0009;color:#fff;padding:3px 7px;border-radius:999px;font-size:.75rem;font-weight:700}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:12px 5px}.stat b{font-size:1.25rem}#map{height:62vh;min-height:400px}}</style></head><body><main class="wrap"><h1>Notre histoire ♡</h1><p class="sub">Tous les endroits où notre histoire nous a emmenés, année après année.</p><section class="stats"><div class="stat"><b id="cities">0</b>villes</div><div class="stat"><b id="memories">0</b>souvenirs</div><div class="stat"><b id="distance">0</b>km ≈</div></section><div class="actionsbar"><a class="btn" href="ajouter.html">＋ Ajouter un souvenir</a><a class="btn secondary" href="admin.html">⚙️ Modifier / supprimer</a></div><div id="legend" class="legend"></div><p class="state" id="state">Chargement de nos souvenirs…</p><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL='https://altfjneygqyltcasankm.supabase.co';const SUPABASE_KEY='sb_publishable_-lcIoJoTRumRVBVT7eQvBQ_O52mFMSM';const COLLECTION='julien-marie-annee-01';const COLORS=['#ef4f88','#4f8ee8','#9b6ce8','#f3a83b','#55b98c','#e66767','#36a6b8','#d96eb4','#7f9d55','#7b78d8'];const map=L.map('map').setView([46.6,2.5],5.5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);load();async function load(){const st=document.getElementById('state');try{const url=`${SUPABASE_URL}/rest/v1/couple_memories?collection_id=eq.${encodeURIComponent(COLLECTION)}&select=id,city,memory_date,memory_end_date,note,photo_url,photo_urls,latitude,longitude,memory_year&order=memory_year.asc,memory_date.asc.nullslast,created_at.asc`;const r=await fetch(url,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();const ps=rows.map(x=>({id:x.id,city:x.city,date:x.memory_date,endDate:x.memory_end_date,text:x.note,photos:(x.photo_urls&&x.photo_urls.length?x.photo_urls:(x.photo_url?[x.photo_url]:[])),lat:x.latitude,lon:x.longitude,year:x.memory_year||1}));render(ps);st.textContent=ps.length?'Touchez un cœur pour ouvrir un souvenir ❤️':'La carte attend notre premier souvenir ❤️'}catch(e){console.error(e);st.textContent='Impossible de charger les souvenirs pour le moment.'}}function render(ps){ps.forEach(p=>{const col=color(p.year),icon=L.divIcon({html:`<div class="heart-marker" style="color:${col}">♥</div>`,className:'',iconSize:[32,32],iconAnchor:[16,26]});const dates=formatRange(p.date,p.endDate);L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<div class="popup">${gallery(p)}<span class="badge" style="background:${col}">Année ${String(p.year).padStart(2,'0')}</span><h3>📍 ${esc(p.city)}</h3>${dates?`<p>📅 ${dates}</p>`:''}${p.text?`<p>${esc(p.text)}</p>`:''}</div>`)});document.getElementById('cities').textContent=new Set(ps.map(p=>p.city.toLowerCase())).size;document.getElementById('memories').textContent=ps.length;let km=0;const dated=[...ps].filter(p=>p.date).sort((a,b)=>a.date.localeCompare(b.date));for(let i=1;i<dated.length;i++)km+=hav(dated[i-1],dated[i]);document.getElementById('distance').textContent=Math.round(km).toLocaleString('fr-FR');const years=[...new Set(ps.map(p=>p.year))].sort((a,b)=>a-b);document.getElementById('legend').innerHTML=years.map(y=>`<div class="legend-item"><span class="legend-heart" style="color:${color(y)}">♥</span> Année ${String(y).padStart(2,'0')}</div>`).join('');if(ps.length){const g=L.featureGroup(ps.map(p=>L.marker([p.lat,p.lon])));map.fitBounds(g.getBounds().pad(.25),{maxZoom:8})}}function gallery(p){if(!p.photos.length)return'';const arr=encodeURIComponent(JSON.stringify(p.photos));return `<div class="gallery" data-photos="${arr}" data-index="0"><img src="${p.photos[0]}" alt="Souvenir à ${esc(p.city)}">${p.photos.length>1?`<button class="gbtn gprev" onclick="slidePhoto(this,-1);event.stopPropagation()">‹</button><button class="gbtn gnext" onclick="slidePhoto(this,1);event.stopPropagation()">›</button><span class="gcount">1/${p.photos.length}</span>`:''}</div>`}function slidePhoto(btn,dir){const g=btn.closest('.gallery'),photos=JSON.parse(decodeURIComponent(g.dataset.photos));let i=(Number(g.dataset.index)+dir+photos.length)%photos.length;g.dataset.index=String(i);g.querySelector('img').src=photos[i];const c=g.querySelector('.gcount');if(c)c.textContent=`${i+1}/${photos.length}`}function formatRange(a,b){if(!a)return'';const f=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});return b&&b!==a?`${f(a)} → ${f(b)}`:f(a)}function color(y){return COLORS[((Number(y)||1)-1)%COLORS.length]}function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dlat=r(b.lat-a.lat),dlon=r(b.lon-a.lon),q=Math.sin(dlat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
