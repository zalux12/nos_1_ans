<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter un souvenir ❤️</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#321428,#b94b73,#ffd1dc);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#ffffff25;border:1px solid #ffffff40;border-radius:26px;padding:22px;backdrop-filter:blur(16px);margin:18px 0}h1{text-align:center;margin-bottom:6px}.sub{text-align:center;opacity:.88;margin-top:0}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea,select{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;color:#4d1831;background:#fff}textarea{min-height:85px}button,a.btn{border:0;background:#fff;color:#b73768;padding:12px 17px;border-radius:999px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin-top:15px}button:disabled{opacity:.65;cursor:wait}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{opacity:.8;font-size:.9rem}.note{font-size:.82rem;opacity:.78;margin-top:6px}.status{font-weight:700;margin-top:14px}.success{background:#ffffff22;border:1px solid #ffffff40;border-radius:18px;padding:16px;margin-top:16px}.hidden{display:none}.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:10px}.preview div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#0002}.preview img{width:100%;height:100%;object-fit:cover;display:block}.progress{font-size:.85rem;opacity:.9;margin-top:8px}@media(max-width:560px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Ajouter un souvenir ♡</h1><p class="sub">Julien, Marie ou quelqu’un d’autre peut enrichir la carte au fil de l’année.</p><a class="btn" href="./">← Voir la carte</a><div class="card"><label>Ville / lieu *</label><input id="city" placeholder="Paris, Nice, Monaco…"><div class="row"><div><label>Date de début <span class="muted">(facultatif)</span></label><input id="date" type="date"></div><div><label>Date de fin <span class="muted">(facultatif)</span></label><input id="endDate" type="date"></div></div><p class="note">Tu peux laisser les deux dates vides si tu ne t’en souviens plus.</p><label>Année de l'album</label><select id="memoryYear"><option value="1">Année 01</option><option value="2">Année 02</option><option value="3">Année 03</option><option value="4">Année 04</option><option value="5">Année 05</option><option value="6">Année 06</option><option value="7">Année 07</option><option value="8">Année 08</option><option value="9">Année 09</option><option value="10">Année 10</option></select><label>Petit texte <span class="muted">(facultatif)</span></label><textarea id="text" placeholder="Disneyland, notre journée à Nice…"></textarea><label>Photos <span class="muted">(facultatif)</span></label><input id="photo" type="file" accept="image/*,.heic,.heif" multiple><p class="note">Jusqu’à 12 photos. JPG, PNG, WebP et HEIC/HEIF sont acceptés.</p><div id="preview" class="preview"></div><div id="photoState" class="progress"></div><button id="saveBtn" type="button" onclick="saveMemory()">+ Ajouter à la carte</button><p id="status" class="status"></p><div id="success" class="success hidden">❤️ Souvenir ajouté ! <a href="./" style="color:#fff;font-weight:800">Voir sur la carte</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script><script>const SUPABASE_URL='https://altfjneygqyltcasankm.supabase.co';const EDGE=SUPABASE_URL+'/functions/v1/couple-memories-edit';const q=s=>document.querySelector(s),v=s=>q(s).value.trim();let preparedPhotos=[],uploadSession=null,nextPhotoIndex=0,previewUrls=[];q('#photo').addEventListener('change',onFilesChanged);function onFilesChanged(){preparedPhotos=[];uploadSession=null;nextPhotoIndex=0;const files=[...q('#photo').files];previewUrls.forEach(URL.revokeObjectURL);previewUrls=files.map(f=>URL.createObjectURL(f));q('#preview').innerHTML=previewUrls.map(u=>`<div><img src="${u}"></div>`).join('');q('#status').textContent=files.length>12?'Maximum 12 photos.':'';q('#photoState').textContent=files.length?`📷 ${files.length} photo${files.length>1?'s':''} sélectionnée${files.length>1?'s':''}.`:'';q('#saveBtn').textContent='+ Ajouter à la carte';q('#success').classList.add('hidden')}async function saveMemory(){const city=v('#city'),date=v('#date'),endDate=v('#endDate'),text=v('#text'),year=Number(q('#memoryYear').value),files=[...q('#photo').files],s=q('#status'),btn=q('#saveBtn');if(!city&&!uploadSession){s.textContent='Indique au moins une ville ou un lieu 🙂';return}if(files.length>12&&!preparedPhotos.length){s.textContent='Maximum 12 photos.';return}if(endDate&&!date&&!uploadSession){s.textContent='Si tu mets une date de fin, indique aussi la date de début.';return}if(endDate&&date&&endDate<date&&!uploadSession){s.textContent='La date de fin doit être après la date de début.';return}btn.disabled=true;q('#photo').disabled=true;s.textContent='';try{if(!preparedPhotos.length&&files.length){for(let i=0;i<files.length;i++){q('#photoState').textContent=`Préparation photo ${i+1}/${files.length} : ${files[i].name}`;preparedPhotos.push(await img(files[i]))}}if(!uploadSession){q('#photoState').textContent='Recherche du lieu…';const geo=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q='+encodeURIComponent(city));if(!geo.ok)throw new Error('geocoding_failed');const gd=await geo.json();if(!gd.length)throw new Error('place_not_found');q('#photoState').textContent='Création du souvenir…';const r=await post({action:'start_public',city,memory_date:date||null,memory_end_date:endDate||null,note:text||null,latitude:+gd[0].lat,longitude:+gd[0].lon,memory_year:year});uploadSession={id:r.id,token:r.token};nextPhotoIndex=0}for(let i=nextPhotoIndex;i<preparedPhotos.length;i++){q('#photoState').textContent=`Envoi photo ${i+1}/${preparedPhotos.length}…`;await post({action:'append_photo',memory_id:uploadSession.id,token:uploadSession.token,photo:preparedPhotos[i]});nextPhotoIndex=i+1}q('#photoState').textContent='Finalisation…';await post({action:'finish_public',memory_id:uploadSession.id,token:uploadSession.token});q('#city').value='';q('#date').value='';q('#endDate').value='';q('#text').value='';q('#photo').value='';preparedPhotos=[];uploadSession=null;nextPhotoIndex=0;previewUrls.forEach(URL.revokeObjectURL);previewUrls=[];q('#preview').innerHTML='';q('#photoState').textContent='';s.textContent='';btn.textContent='+ Ajouter à la carte';q('#success').classList.remove('hidden')}catch(e){console.error(e);const msg=humanError(e);s.textContent=msg;btn.textContent=uploadSession?'↻ Réessayer l’envoi':'+ Réessayer';if(preparedPhotos.length){q('#photoState').textContent=`📷 Photos conservées dans cette page. ${nextPhotoIndex}/${preparedPhotos.length} déjà envoyée${nextPhotoIndex>1?'s':''}.`}}finally{btn.disabled=false;q('#photo').disabled=false}}async function post(body){let r;try{r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('network_error')}let data={};try{data=await r.json()}catch{}if(!r.ok){const code=data.error||('http_'+r.status);const err=new Error(code);err.detail=data.detail||'';throw err}return data}function humanError(e){const c=e.message||'';if(c==='place_not_found')return'Lieu introuvable. Essaie avec une ville plus précise.';if(c==='network_error'||c==='geocoding_failed')return'Problème de connexion. Tes photos sont conservées : clique sur Réessayer.';if(c==='photo_too_large')return'Une photo reste trop lourde après compression. Tes autres photos sont conservées.';if(c==='photo_limit_reached')return'Ce souvenir contient déjà 12 photos.';if(c==='invalid_upload_session')return'La session d’envoi a expiré. Recharge la page et réessaie.';if(c.startsWith('heic_failed:'))return`Impossible de convertir ${c.slice(12)} (HEIC/HEIF). Les autres photos restent sélectionnées.`;if(c.startsWith('image_read_failed:'))return`Impossible de lire ${c.slice(18)}. Essaie de réexporter cette photo.`;return`Erreur d’envoi : ${c||'inconnue'}${e.detail?' — '+e.detail:''}. Tes photos restent sélectionnées pour réessayer.`}function isHeic(f){return /\.(heic|heif)$/i.test(f.name)||/image\/(heic|heif)/i.test(f.type)}async function img(f){let source=f;if(isHeic(f)){if(typeof heic2any!=='function')throw new Error('heic_failed:'+f.name);try{const converted=await heic2any({blob:f,toType:'image/jpeg',quality:.9});source=Array.isArray(converted)?converted[0]:converted}catch(e){throw new Error('heic_failed:'+f.name)}}return new Promise((ok,no)=>{const url=URL.createObjectURL(source),im=new Image;im.onload=()=>{try{const m=640,z=Math.min(1,m/im.width,m/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.5))}catch(e){URL.revokeObjectURL(url);no(new Error('image_read_failed:'+f.name))}};im.onerror=()=>{URL.revokeObjectURL(url);no(new Error('image_read_failed:'+f.name))};im.src=url})}</script></body></html>
