<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Quiz — Notre première année ❤️</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --pink:#b73768;
      --glass:rgba(255,255,255,.18);
      --border:rgba(255,255,255,.26);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.35), transparent 25%),
        linear-gradient(135deg, #321428, #b94b73, #ffd1dc);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,.18), transparent, rgba(255,255,255,.14));
      pointer-events: none;
    }
    .page {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .page.active { display: flex; }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 30px 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.22);
    }
    h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 16px; line-height: 1.15; }
    h2 { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 18px; }
    p { font-size: 1.05rem; line-height: 1.6; }
    button {
      border: none;
      padding: 14px 20px;
      border-radius: 999px;
      background: #fff;
      color: var(--pink);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(0,0,0,.18);
    }
    .progress-wrap { margin: 0 0 20px; }
    .progress-text { font-weight: 800; margin-bottom: 8px; }
    .progress-bar { height: 10px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: #fff; width: 0%; transition: width .25s ease; }
    .media { margin: 18px 0; }
    .media img { width: 100%; max-height: 360px; object-fit: contain; border-radius: 20px; background: rgba(0,0,0,.1); }
    .quote { margin: 18px 0; padding: 16px 18px; border-radius: 18px; background: rgba(255,255,255,.12); font-style: italic; }
    .answers { display: grid; gap: 12px; margin-top: 20px; }
    .answer {
      width: 100%;
      text-align: left;
      background: rgba(255,255,255,.94);
      color: #4d1831;
      border-radius: 18px;
      padding: 15px 16px;
      font-weight: 800;
      box-shadow: none;
    }
    .answer:disabled { opacity: .7; cursor: default; }
    .feedback { margin-top: 18px; font-weight: 800; min-height: 28px; }
    .next-btn { display:none; margin-top: 16px; }
    .heart { font-size: 4rem; margin-bottom: 12px; }
    .score { font-size: clamp(2.8rem, 10vw, 4.6rem); font-weight: 900; margin: 8px 0 14px; }
    .small { opacity:.9; }
  </style>
</head>
<body>
  <section class="page active" id="introPage">
    <div class="card">
      <div class="heart">❤️</div>
      <h1>Tu connais vraiment notre première année ?</h1>
      <p>15 questions. Quelques pièges. Beaucoup de souvenirs.</p>
      <button onclick="startQuiz()">Commencer le quiz</button>
    </div>
  </section>

  <section class="page" id="quizPage">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-text" id="progressText">Question 1 / 15</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <h2 id="questionText"></h2>
      <div class="media" id="mediaWrap" style="display:none"><img id="questionImage" alt="Photo de la question"></div>
      <div class="quote" id="quoteBox" style="display:none"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Question suivante</button>
    </div>
  </section>

  <section class="page" id="resultPage">
    <div class="card">
      <div class="heart">❤️</div>
      <h1>Résultat</h1>
      <div class="score" id="scoreText">0 / 15</div>
      <p id="scoreMessage"></p>
      <p class="small">Merci pour cette première année ❤️</p>
    </div>
  </section>

  <script>
    const questions = [
      ...Array.from({length:15}, (_,i) => ({
        question:`QUESTION ${i+1} À PERSONNALISER`,
        quote:'',
        image:'',
        answers:['Réponse A','Réponse B','Réponse C','Réponse D'],
        correct:0,
        goodMessage:'Bien joué ❤️',
        badMessage:'Raté 😭'
      }))
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    function showPage(id){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz(){
      current = 0;
      score = 0;
      showPage('quizPage');
      renderQuestion();
    }

    function renderQuestion(){
      answered = false;
      const q = questions[current];
      document.getElementById('progressText').textContent = `Question ${current+1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((current+1)/questions.length)*100}%`;
      document.getElementById('questionText').textContent = q.question;

      const mediaWrap = document.getElementById('mediaWrap');
      const img = document.getElementById('questionImage');
      if(q.image){ img.src = q.image; mediaWrap.style.display='block'; } else { mediaWrap.style.display='none'; img.removeAttribute('src'); }

      const quoteBox = document.getElementById('quoteBox');
      if(q.quote){ quoteBox.textContent = q.quote; quoteBox.style.display='block'; } else { quoteBox.style.display='none'; quoteBox.textContent=''; }

      const answers = document.getElementById('answers');
      answers.innerHTML = '';
      q.answers.forEach((text, index) => {
        const b = document.createElement('button');
        b.className = 'answer';
        b.textContent = text;
        b.onclick = () => answerQuestion(index);
        answers.appendChild(b);
      });

      document.getElementById('feedback').textContent='';
      document.getElementById('nextBtn').style.display='none';
      document.getElementById('nextBtn').textContent = current === questions.length-1 ? 'Voir mon score' : 'Question suivante';
    }

    function answerQuestion(index){
      if(answered) return;
      answered = true;
      const q = questions[current];
      const buttons = document.querySelectorAll('.answer');
      buttons.forEach(b=>b.disabled=true);
      if(index === q.correct){
        score++;
        document.getElementById('feedback').textContent = q.goodMessage || 'Bien joué ❤️';
      } else {
        document.getElementById('feedback').textContent = q.badMessage || 'Raté 😭';
      }
      document.getElementById('nextBtn').style.display='inline-block';
    }

    function nextQuestion(){
      if(!answered) return;
      current++;
      if(current >= questions.length){
        showResults();
      } else {
        renderQuestion();
      }
    }

    function showResults(){
      showPage('resultPage');
      document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
      let msg='';
      if(score === 15) msg='15/15 👑 Tu connais notre première année par cœur.';
      else if(score >= 12) msg='Très solide 😌 Tu peux rester ma copine ❤️';
      else if(score >= 9) msg='Pas mal du tout… quelques révisions de Photobox quand même 👀';
      else if(score >= 5) msg='Bon… on va dire que le stress a joué 😭';
      else msg='Marie… je viens quand même de te faire un album entier pour réviser 💀';
      document.getElementById('scoreMessage').textContent = msg;
    }
  </script>
</body>
</html>
