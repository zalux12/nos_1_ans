<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos 1 an</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #fff;
      padding: 25px;
    }

    .card {
      background: rgba(255, 255, 255, 0.20);
      padding: 35px;
      border-radius: 25px;
      max-width: 700px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.25em;
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❤️ Nos 1 an ❤️</h1>
    <p>
Mon texte ici...

Merci pour cette première année incroyable.
Je suis trop heureux de t’avoir dans ma vie.

Je t’aime ❤️
    </p>
  </div>
</body>
</html>
